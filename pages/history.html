<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity-history</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <main
      class="card card-main border-0 shadow-sm p-4 bg-white d-flex flex-column rounded-3"
    >
      <!-- Header Title -->
      <h1 class="h3 fw-semibold text-custom-blue mb-4">Activity history</h1>

      <!-- Filter Row Toolbar Grid -->
      <div class="row g-3 p-3 bg-light-blue rounded-3 mb-4">
        <div class="col-12 col-md-3">
          <input
            type="text"
            class="form-control filter-control"
            placeholder="Search title..."
          />
        </div>
        <div class="col-12 col-md-3">
          <select class="form-select filter-control">
            <option selected>All members</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <select class="form-select filter-control">
            <option selected>All categories</option>
          </select>
        </div>
        <div class="col-12 col-md-3">
          <select class="form-select filter-control">
            <option selected>All months</option>
          </select>
        </div>
      </div>

      <!-- Center Empty State Block -->
      <div
        class="empty-state-box flex-grow-1 d-flex flex-column align-items-center justify-content-center p-5 bg-white rounded-3"
      >
        <i class="bi bi-clock icon-large mb-2"></i>
        <p class="text-secondary mb-0 fw-medium">No activity yet</p>
      </div>

      <!-- Footer Info Text -->
      <footer class="mt-4 text-primary small">
        Rates updated 10/19/2026, 10:43:16 AM -
        <a href="#" class="text-decoration-none fw-semibold"
          >Rates By Exchange Rate API</a
        >
      </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="js/app.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
