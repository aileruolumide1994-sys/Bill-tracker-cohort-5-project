<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="OfficeFlow - track shared office expenses, claims and petty cash."
    />
    <title>OfficeFlow - Settings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>

  <body>
    <div class="d-flex">
      <!-- SIDEBAR -->
      <aside
        class="offcanvas-lg offcanvas-start sidebar"
        tabindex="-1"
        id="sidebar"
        aria-labelledby="sidebarTitle"
      >
        <div class="offcanvas-header d-lg-none border-bottom">
          <h5 class="offcanvas-title" id="sidebarTitle">OfficeFlow</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            data-bs-target="#sidebar"
            aria-label="Close menu"
          ></button>
        </div>

        <div class="offcanvas-body d-flex flex-column p-3">
          <a
            href="../index.html"
            class="d-flex align-items-center gap-2 text-decoration-none text-dark border-bottom pb-3 mb-3"
          >
            <span class="brand-icon"><i class="bi bi-wallet2"></i></span>
            <span>
              <strong class="d-block">OfficeFlow</strong>
              <small class="text-secondary">Team Finance Manager</small>
            </span>
          </a>

          <nav
            class="nav nav-pills flex-column gap-1"
            aria-label="Main navigation"
          >
            <a href="../index.html" class="nav-link">
              <i class="bi bi-grid"></i>
              <span>Overview</span>
            </a>

            <a href="expenses.html" class="nav-link">
              <i class="bi bi-receipt"></i>
              <span>Expenses &amp; Claims</span>
            </a>

            <a href="balances.html" class="nav-link">
              <i class="bi bi-people"></i>
              <span>Team Balances</span>
            </a>

            <a href="settle-up.html" class="nav-link">
              <i class="bi bi-arrow-left-right"></i>
              <span>Settle Up</span>
            </a>

            <a href="payments.html" class="nav-link">
              <i class="bi bi-cash-stack"></i>
              <span>Payments</span>
            </a>

            <a href="recurring-bills.html" class="nav-link">
              <i class="bi bi-calendar-check"></i>
              <span>Recurring Bills</span>
            </a>

            <a href="history.html" class="nav-link">
              <i class="bi bi-clock-history"></i>
              <span>Activity History</span>
            </a>

            <a href="members.html" class="nav-link">
              <i class="bi bi-person-lines-fill"></i>
              <span>Team Members</span>
            </a>
          </nav>

          <div class="mt-auto pt-4">
            <a href="settings.html" class="nav-link mb-3 active">
              <i class="bi bi-gear"></i>
              <span>Settings</span>
            </a>
          </div>
        </div>
      </aside>

      <div id="notificationArea" aria-live="polite" aria-atomic="true"></div>

      <div class="main-content flex-grow-1">
        <nav
          class="navbar bg-white border-bottom px-3 py-2 sticky-top"
          aria-label="Top bar"
        >
          <div class="container-fluid gap-2 p-0">
            <button
              class="btn btn-outline-secondary d-lg-none border-0"
              type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#sidebar"
              aria-controls="sidebar"
              aria-label="Open navigation menu"
            >
              <i class="bi bi-list fs-3"></i>
            </button>

            <div class="dropdown">
              <button
                class="btn btn-light border dropdown-toggle"
                data-bs-toggle="dropdown"
                type="button"
                id="teamSelector"
              >
                Select a team
              </button>
              <ul class="dropdown-menu" id="teamList"></ul>
            </div>

            <form class="search-form flex-grow-1" role="search">
              <div class="input-group">
                <span class="input-group-text bg-white"
                  ><i class="bi bi-search"></i
                ></span>
                <input
                  type="search"
                  name="q"
                  class="form-control"
                  placeholder="Search transactions, claims, receipts..."
                  aria-label="Search transactions"
                />
              </div>
            </form>

            <div class="d-flex align-items-center gap-2">
              <span class="badge rounded-pill balance-badge">
                <i class="bi bi-check-circle me-1"></i>
                <span class="balance-text">System Balanced (₦0.00)</span>
              </span>
              <button
                type="button"
                class="btn btn-light position-relative"
                aria-label="Notifications"
              >
                <i class="bi bi-bell"></i>
                <span class="notification-dot"></span>
              </button>
              <button
                type="button"
                class="profile-avatar"
                aria-label="User profile"
              ></button>
            </div>
          </div>
        </nav>

        <main
          class="container-fluid p-4"
          id="pageContent"
          data-title="Settings"
          data-icon="bi-gear"
        ></main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/app.js"></script>
  </body>
</html>
